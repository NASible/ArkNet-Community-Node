server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location ~ ^/api/v1/(operator/(setup(?:/confirm)?|sessions)|(?:local-users|global-users)/sessions?|global-users/login(?:/complete)?)$ {
        set $member_backend http://arknet-agent:8082;
        proxy_pass $member_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        set $agent_backend http://arknet-agent:8081;
        proxy_pass $agent_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ /index.html; }
}
