# Project-only DNS. No upstream servers and no /etc/hosts imports.
# The host firewall additionally limits DNS to the existing tailnet.
port=53
listen-address=100.64.0.21
bind-interfaces
no-resolv
no-poll
no-hosts
domain-needed
local=/nodenet.arknet.media/
local-ttl=60
host-record=nodenet.arknet.media,100.64.0.21
host-record=core.nodenet.arknet.media,100.64.0.21
host-record=tracker.nodenet.arknet.media,100.64.0.21
host-record=node-a.nodenet.arknet.media,100.64.0.22
host-record=member-a.nodenet.arknet.media,100.64.0.22
host-record=node-b.nodenet.arknet.media,100.64.0.23
host-record=member-b.nodenet.arknet.media,100.64.0.23
host-record=node-c.nodenet.arknet.media,100.64.0.24
host-record=member-c.nodenet.arknet.media,100.64.0.24
host-record=jellyfin-a.nodenet.arknet.media,100.64.0.22
host-record=jellyfin-b.nodenet.arknet.media,100.64.0.23
host-record=jellyfin-c.nodenet.arknet.media,100.64.0.24
