# Supported Core + tracker ingress. Do not add raw request/header fields to logs.
# Nginx's error log cannot redact request URLs, so it has no request-time sink.
user nginx;
worker_processes auto;
error_log /dev/null;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    # Only fixed labels leave this map, including for malformed/unknown paths.
    # No URI fragments, query values, hostnames, headers or credentials are logged.
    map $uri $arknet_log_route {
        default                             "[REDACTED]";
        /health                             "/health";
        ~^/announce/                        "/announce/[REDACTED]";
        ~^/api/torrent/v1/media/             "/api/torrent/v1/media/[REDACTED]";
        ~^/api/web-seed/v1/media/            "/api/web-seed/v1/media/[REDACTED]";
        ~^/api/                             "/api/[REDACTED]";
        /node-login                         "/node-login";
    }
    log_format arknet_safe escape=json
        '{"route":"$arknet_log_route","status":$status,'
        '"bytes":$body_bytes_sent,"seconds":$request_time}';
    access_log /dev/stdout arknet_safe;

    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 16m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_redirect off;

    ssl_certificate /etc/arknet/tls/cert.pem;
    ssl_certificate_key /etc/arknet/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:arknet_tls:10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Separate TLS sockets avoid Host/SNI routing or rewrite dependencies.
    # For standard port 443, publish these on separate host IPs.
    server {
        listen 8443 ssl default_server;
        server_name _;
        location / {
            set $arknet_core http://arknet-core:8080;
            # No URI suffix or rewrite: signed escaped paths and queries survive.
            proxy_pass $arknet_core;
        }
    }
    server {
        listen 8444 ssl default_server;
        server_name _;
        location / {
            set $arknet_tracker http://arknet-tracker:6969;
            proxy_pass $arknet_tracker;
        }
    }
}
